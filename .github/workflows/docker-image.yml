name: Build, Push, and Deploy Docker Image
 
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
 
jobs:
  build:
    # split the original single "build-and-deploy" job into two jobs -
    # "build" (runs on both push and PR, never pushes an image, just validates
    # the Dockerfile builds) and "push-and-deploy" (runs ONLY on push to main).
    # Original behaviour built AND PUSHED a real image to Docker Hub on every
    # pull request too, tagged with the PR's commit sha - 
    # (unmerged/experimental code gets published as a real image)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Build Docker image (validation only, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
 
  push-and-deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/churn-predictor-api:latest
            ${{ secrets.DOCKER_USERNAME }}/churn-predictor-api:${{ github.sha }}
